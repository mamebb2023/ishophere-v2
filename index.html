<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tofik Store" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400..700&amp;family=Noto+Sans+Ethiopic:wght@400..700&amp;display=swap"
      rel="stylesheet"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1e5b3a" />

    <title>Tofik Store — Online Shopping in Saudi Arabia</title>
    <meta
      name="description"
      content="Shop everyday essentials at Tofik Store. Browse products, see live prices and stock, and check out quickly with your phone or email."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="Tofik Store" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tofik Store" />
    <meta
      property="og:title"
      content="Tofik Store — Online Shopping in Saudi Arabia"
    />
    <meta
      property="og:description"
      content="Shop everyday essentials at Tofik Store. Browse products, see live prices and stock, and check out quickly with your phone or email."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta
      property="og:image:alt"
      content="Tofik Store — everyday essentials, delivered"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Tofik Store — Online Shopping in Saudi Arabia"
    />
    <meta
      name="twitter:description"
      content="Shop everyday essentials at Tofik Store. Browse products, see live prices and stock, and check out quickly with your phone or email."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Tofik Store — everyday essentials, delivered"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "OnlineStore",
            "name": "Tofik Store",
            "url": "%SITE_URL%/",
            "description": "An online shop for everyday essentials with live prices, real stock counts, and quick phone or email checkout.",
            "logo": "%SITE_URL%/logo.png",
            "image": "%SITE_URL%/logo.png",
            "currenciesAccepted": "SAR",
            "areaServed": {
              "@type": "Country",
              "name": "Saudi Arabia"
            }
          },
          {
            "@type": "WebSite",
            "name": "Tofik Store",
            "url": "%SITE_URL%/",
            "description": "An online shop for everyday essentials with live prices, real stock counts, and quick phone or email checkout.",
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
